<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filter for Foreground Text & Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes waveShift {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes streamBeat {
      0%, 100% { height: 18px; }
      50% { height: 42px; }
    }

    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .particle1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .wave { animation: waveShift 12s ease-in-out infinite; }

    .eq-bar1 { animation: streamBeat 1.2s ease-in-out infinite; }
    .eq-bar2 { animation: streamBeat 0.9s ease-in-out infinite 0.2s; }
    .eq-bar3 { animation: streamBeat 1.4s ease-in-out infinite 0.4s; }
    .eq-bar4 { animation: streamBeat 1.0s ease-in-out infinite 0.1s; }
    .eq-bar5 { animation: streamBeat 1.3s ease-in-out infinite 0.3s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.3px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern for High Tech Aesthetic -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic / Animated Background Glow Elements (Safely in background) -->
  <g>
    <circle class="orb1" cx="220" cy="110" r="140" fill="url(#glowGrad1)" />
    <circle class="orb2" cx="980" cy="240" r="170" fill="url(#glowGrad2)" />
    
    <!-- Moving Streaming Wave Lines in the background bottom -->
    <path class="wave" d="M -50 310 Q 150 280, 350 315 T 750 310 T 1150 315 T 1300 300" fill="none" stroke="url(#waveGrad)" stroke-width="3" />
    <path class="wave" d="M -50 330 Q 180 345, 380 325 T 780 335 T 1180 325 T 1300 340" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.6" />

    <!-- Ambient floating particles -->
    <circle class="particle1" cx="150" cy="260" r="3" fill="#38bdf8" />
    <circle class="particle2" cx="1060" cy="90" r="4" fill="#c084fc" />
    <circle class="particle3" cx="720" cy="70" r="2.5" fill="#818cf8" />
    <circle class="particle1" cx="420" cy="50" r="3" fill="#06b6d4" />
  </g>

  <!-- Audio / Video Streaming Equalizer Dynamic Graphic Element (Header Right) -->
  <g transform="translate(1040, 50)" opacity="0.8">
    <rect class="eq-bar1" x="0" y="0" width="5" rx="2.5" fill="#38bdf8" />
    <rect class="eq-bar2" x="10" y="0" width="5" rx="2.5" fill="#60a5fa" />
    <rect class="eq-bar3" x="20" y="0" width="5" rx="2.5" fill="#818cf8" />
    <rect class="eq-bar4" x="30" y="0" width="5" rx="2.5" fill="#a855f7" />
    <rect class="eq-bar5" x="40" y="0" width="5" rx="2.5" fill="#ec4899" />
  </g>

  <!-- Streaming Media Play Icon in top corner -->
  <g transform="translate(80, 48)">
    <rect width="48" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <polygon points="19,15 35,24 19,33" fill="url(#titleGrad)" filter="url(#glow)" />
  </g>

  <!-- Main Foreground Content Area with Crisp Shadow to Guarantee Legibility -->
  <g filter="url(#shadow)">
    <!-- Category Badge -->
    <g transform="translate(142, 56)">
      <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10b981" />
      <text x="28" y="21" fill="#94a3b8" class="tag-text">CURATED STREAMING ECOSYSTEM</text>
    </g>

    <!-- Main Title (Guaranteed Foreground) -->
    <text x="80" y="152" fill="url(#titleGrad)" class="title-text">Awesome Media Streaming Platforms</text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="80" y="196" fill="#e2e8f0" class="subtitle-text">The Ultimate Index of Self-Hosted Media Servers, Commercial OTT Services &amp; Live TV</text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(80, 235)">
      <!-- Pill 1: Self-Hosted -->
      <g transform="translate(0, 0)">
        <rect width="185" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <text x="16" y="23" fill="#38bdf8" class="tag-text">⚡ Self-Hosted Servers</text>
      </g>
      
      <!-- Pill 2: Commercial SaaS -->
      <g transform="translate(200, 0)">
        <rect width="185" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <text x="16" y="23" fill="#a855f7" class="tag-text">🎬 Commercial OTT SaaS</text>
      </g>

      <!-- Pill 3: Live TV & P2P -->
      <g transform="translate(400, 0)">
        <rect width="185" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <text x="16" y="23" fill="#34d399" class="tag-text">📡 Live IPTV &amp; P2P Stacks</text>
      </g>

      <!-- Pill 4: Audio & Podcasts -->
      <g transform="translate(600, 0)">
        <rect width="185" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <text x="16" y="23" fill="#f472b6" class="tag-text">🎧 Audiobooks &amp; Music</text>
      </g>
    </g>
  </g>
</svg>
